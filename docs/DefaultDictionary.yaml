# DefaultDictionary.yaml
# アプリ起動時に読み込む既定の辞書（src/utils/defaultDictionary.ts）。
# Vault メモ「ThinktankDictionary」の内容で上書きできる（TextEditor.Dictionary.Load / Reset / Save）。
#
# 書式:
#   - トップレベルは「キー: 値」の対応表（YAML のマッピング）。
#   - 値は文字列・数値・真偽値・リスト・入れ子のマッピングのいずれでもよい。
#   - 入れ子の値は "親.子" のドット区切りキーで引ける（lookupDictionary('親.子')）。
#   - 上書きはトップレベルのキー単位（メモに書いたキーだけ置き換わり、他は既定のまま）。
#
# 例（必要に応じてコメントを外して使う）:
# AS:公開情報: 06a7574d-c658-426a-9779-d2674f535411
# 臨床ガイドライン・ICH:
#   id: c238fcb4-c550-45ec-bb45-933ee1c46530
#   description: ICH ガイドライン集


