name: CI

# push / PR のたびに型チェックと単体テストを走らせる。
# 目的: マージ前に「型崩れ」「純粋関数の退行」を機械的に検出する
#       （PROJECT_REVIEW_REPORT.md D-6 / F1-6, F1-7 への対応の第一歩）。

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # electron / vitest / jsdom などのツールが Node 22.12+ を要求するため 22 を使う。
          # 本番サーバー(dist-server)は Dockerfile の node:20 で動くが、server/ の型チェックは
          # コードを実行しないので Node バージョンに依存しない。
          node-version: '22'
          cache: npm

      - run: npm ci

      # フロント + サーバーの両 tsconfig を型チェック（build:server 忘れの検出も兼ねる）
      - name: Typecheck
        run: npm run typecheck

      # ESLint（最小構成。error は no-floating-promises と rules-of-hooks のみ。
      # warning は許容 = 既存の exhaustive-deps 16件では落ちない）
      - name: Lint
        run: npm run lint

      # 純粋関数の単体テスト（vitest run）
      - name: Unit tests
        run: npm run test

      # 本番ビルドが壊れていないかの確認（任意だが早期検出に有効）
      - name: Production build
        run: npm run build
